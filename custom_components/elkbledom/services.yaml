# Service definitions for ElkBLEDOM integration
set_rgbw_channels:
  name: Set RGBW channels
  description: Control individual RGBW channels on compatible LED devices
  fields:
    entity_id:
      name: Entity
      description: The light entity to control
      required: true
      selector:
        entity:
          integration: elkbledom
          domain: light
    red:
      name: Red channel
      description: Enable red LED channel
      default: true
      selector:
        boolean:
    green:
      name: Green channel
      description: Enable green LED channel
      default: true
      selector:
        boolean:
    blue:
      name: Blue channel  
      description: Enable blue LED channel
      default: true
      selector:
        boolean:
    white:
      name: White channel
      description: Enable white LED channel
      default: true
      selector:
        boolean:
    mode:
      name: Light mode
      description: Operating mode for the device
      default: 0
      selector:
        select:
          options:
            - label: "All channels"
              value: 0
            - label: "RGB only"
              value: 1
            - label: "White only"
              value: 2
            - label: "Color temperature"
              value: 3
            - label: "Laser (if supported)"
              value: 4

set_schedule_on:
  name: Set turn-on schedule
  description: Schedule the light to turn on automatically at a specific time
  fields:
    entity_id:
      name: Entity
      description: The light entity to schedule
      required: true
      selector:
        entity:
          integration: elkbledom
          domain: light
    time:
      name: Time
      description: Time to turn on the light
      required: true
      selector:
        time:
    monday:
      name: Monday
      description: Enable for Monday
      default: true
      selector:
        boolean:
    tuesday:
      name: Tuesday
      description: Enable for Tuesday
      default: true
      selector:
        boolean:
    wednesday:
      name: Wednesday
      description: Enable for Wednesday
      default: true
      selector:
        boolean:
    thursday:
      name: Thursday
      description: Enable for Thursday
      default: true
      selector:
        boolean:
    friday:
      name: Friday
      description: Enable for Friday
      default: true
      selector:
        boolean:
    saturday:
      name: Saturday
      description: Enable for Saturday
      default: true
      selector:
        boolean:
    sunday:
      name: Sunday
      description: Enable for Sunday
      default: true
      selector:
        boolean:
    enabled:
      name: Enabled
      description: Whether the schedule is active
      default: true
      selector:
        boolean:

